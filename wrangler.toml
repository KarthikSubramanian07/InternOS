# Cloudflare Worker configuration for InternOS.
#
# This file is committed and contains NO secrets. All personal tokens/keys are
# set with `wrangler secret put <NAME>` (see README) and the resume/profile
# lives in KV, uploaded with `npm run setup:profile`.

name = "internos"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# PAUSED: no scheduled runs. Nothing calls Notion/Groq/Gmail on a schedule; the
# Worker stays deployed but idle. To RESUME, restore the crons line below and
# run `npm run deploy`.
#   - "0 1,13 * * *"  scrape + Notion sync + recalibration, twice daily (13:00 / 01:00 UTC)
#   - "*/10 * * * *"  lightweight poll: draft Apply-checked rows / archive Dismissed rows
#                     (keep this string in sync with POLL_CRON in src/index.ts)
[triggers]
crons = []
# crons = ["0 1,13 * * *", "*/10 * * * *"]

# KV namespace stores:
#   - the set of already-seen job hashes (dedupe)
#   - your private profile JSON (resume/preferences), key "profile"
#
# Create it once with:  wrangler kv namespace create JOBS
# then paste the returned id below (and a preview_id for `wrangler dev`).
[[kv_namespaces]]
binding = "JOBS"
id = "662de5bdd2b14ec99fbb0253132436fd"
preview_id = "6a2528c013a44f8b8fde4116cf4bc9b9"

# Non-secret, non-personal tuning knobs live here so they're visible in the repo.
[vars]
# Groq chat-completions model used for drafting. Any Groq-hosted model works.
GROQ_MODEL = "llama-3.3-70b-versatile"
# Only keep listings whose title looks like an internship / co-op.
INTERNSHIPS_ONLY = "true"
# Only keep postings dated within this many days (recency window). "2d"/"3w"/"1mo"
# age strings from the GitHub lists are parsed into real dates. Set "0" to disable.
MAX_AGE_DAYS = "31"
# SimplifyJobs-only cutoff: drop Simplify listings dated before this (you've already
# reviewed older ones there manually). Other sources keep the full MAX_AGE_DAYS window.
# Set "" to disable. ISO date (YYYY-MM-DD).
SIMPLIFY_MIN_DATE = "2026-07-04"
# --- Subrequest budget (Cloudflare free plan = 50 fetches per invocation) ---
# Company boards are scanned in a rotating window: each run fetches this many
# boards starting from a KV cursor, then advances. Over several runs the whole
# company list gets covered. GitHub lists (huge yield, ~7 fetches) run every time.
BOARD_FETCHES_PER_RUN = "20"
# Cap new Notion rows created per run (each is one subrequest). Unwritten jobs
# are picked up next run. Keep github(~7) + boards + new-rows under 50 on free.
MAX_NEW_PER_RUN = "20"
# Email open/click tracking in recruiter-email drafts. "true" embeds a pixel +
# wraps links (requires WORKER_BASE_URL). Off by default (privacy/deliverability).
TRACK_EMAIL_OPENS = "false"
# Public Worker origin for tracking URLs. Set to your own deployed workers.dev
# URL (only used when TRACK_EMAIL_OPENS = "true").
WORKER_BASE_URL = "https://your-worker.workers.dev"

# ---------------------------------------------------------------------------
# Secrets (DO NOT put values here — set with `wrangler secret put NAME`):
#   NOTION_TOKEN          Notion internal integration token
#   NOTION_DATABASE_ID    target database id
#   GROQ_API_KEY          Groq API key (each user brings their own)
#   GMAIL_CLIENT_ID       Google OAuth client id
#   GMAIL_CLIENT_SECRET   Google OAuth client secret
#   GMAIL_REFRESH_TOKEN   refresh token from `npm run auth:gmail`
#   WEBHOOK_SECRET        random string; must match the token in the Notion
#                         automation webhook URL (?token=...)
# ---------------------------------------------------------------------------
