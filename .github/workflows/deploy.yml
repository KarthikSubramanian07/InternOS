name: Deploy

# Deploys to Cloudflare Workers. MANUAL ONLY (Actions tab → Deploy → Run workflow)
# so pushes to main never fail on a deploy step, and the project stays paused.
#
# Requires a repo secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables →
# Actions). Create a VALID token at dash.cloudflare.com → My Profile → API Tokens →
# "Edit Cloudflare Workers" template. Worker secrets (NOTION_TOKEN, GROQ_API_KEY,
# etc.) live in Cloudflare and persist across deploys — they are NOT set here.
#
# To re-enable auto-deploy on every push to main, add back:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + test (gate)
        run: npm run typecheck && npm test

      - name: Deploy
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy skipped
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "Skipping deploy — add the CLOUDFLARE_API_TOKEN repo secret to enable auto-deploy."
